substitutions:
  device_name: edecoa-esp32
  friendly_name: "EDECOA EM-402A"

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  comment: "EDECOA EM-402A via RS232 / HW-027 MAX3232"
  project:
    name: "alex.edecoa-em402a"
    version: "6.5-auto-charge-range-probe"
  on_boot:
    priority: -100
    then:
      - delay: 10s
      - lambda: |-
          ESP_LOGI("range_probe", "AUTO PROBE: QMCHGCR");
          id(inverter).queue_command("QMCHGCR");
      - delay: 7s
      - lambda: |-
          ESP_LOGI("range_probe", "AUTO PROBE: QMUCHGCR");
          id(inverter).queue_command("QMUCHGCR");

esp32:
  board: esp32-c3-devkitm-1
  variant: esp32c3
  framework:
    type: esp-idf

external_components:
  - source: github://syssi/esphome-pipsolar@main
    refresh: 0s

# USB_SERIAL_JTAG keeps GPIO2/GPIO3 free for inverter UART.
logger:
  level: DEBUG
  hardware_uart: USB_SERIAL_JTAG

api:

ota:
  - platform: esphome

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  min_auth_mode: WPA2
  power_save_mode: none

  ap:
    ssid: "EDECOA-EM402A-Fallback"

captive_portal:

web_server:
  port: 80

# ============================================================
# RS232 UART
# ESP32-C3 GPIO3 TX -> MAX3232 TTL input
# ESP32-C3 GPIO2 RX <- MAX3232 TTL output
# ============================================================

uart:
  id: inverter_uart
  tx_pin: GPIO3
  rx_pin: GPIO2
  baud_rate: 2400
  data_bits: 8
  parity: NONE
  stop_bits: 1
  debug:
    direction: BOTH
    dummy_receiver: false
    after:
      timeout: 100ms
    sequence:
      - lambda: UARTDebug::log_string(direction, bytes, debug_prefix);

pip2424mse1:
  id: inverter
  uart_id: inverter_uart

