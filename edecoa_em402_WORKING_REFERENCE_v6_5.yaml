# ============================================================
# HOME ASSISTANT CONTROLS
#
# IMPORTANT:
# This EDECOA rejects the pip2424mse1 default AC command format
# MUCHGC0xxx (example: MUCHGC0010).
#
# For AC current we therefore queue the older/shorter protocol form
# directly through pip2424mse1 itself:
#   2 A  -> MUCHGC002
#   10 A -> MUCHGC010
#   ...
#   80 A -> MUCHGC080
#
# queue_command() is part of pip2424mse1, so CRC and UART arbitration
# remain handled by the component.
#
# TOTAL current protocol:
#   <=100 A -> MCHGC<nnn>  (example MCHGC060)
#   >100 A  -> MNCHGC<mnnn>, where m is parallel inverter number.
#              For a single inverter we probe/use m=0, so 110 A -> MNCHGC0110.
#
# On every boot this debug build automatically sends the read-only queries
# QMCHGCR and QMUCHGCR. Their raw replies are visible in UART DEBUG.
#
# QBATCD-related entities are intentionally removed because this EDECOA
# does not answer QBATCD; removing them avoids a 5-second timeout every cycle.
# ============================================================

select:
  # -------- Main requirement: AC/grid charge current --------
  - platform: template
    id: ac_charge_current_select
    name: "${friendly_name} Струм заряду від мережі [AC_CHARGE_CURRENT]"
    entity_category: config
    optimistic: true
    restore_value: false
    options:
      - "2 A"
      - "10 A"
      - "20 A"
      - "30 A"
      - "40 A"
      - "50 A"
      - "60 A"
      - "70 A"
      - "80 A"
    set_action:
      - lambda: |-
          if (x == "2 A") {
            id(inverter).queue_command("MUCHGC002");
          } else if (x == "10 A") {
            id(inverter).queue_command("MUCHGC010");
          } else if (x == "20 A") {
            id(inverter).queue_command("MUCHGC020");
          } else if (x == "30 A") {
            id(inverter).queue_command("MUCHGC030");
          } else if (x == "40 A") {
            id(inverter).queue_command("MUCHGC040");
          } else if (x == "50 A") {
            id(inverter).queue_command("MUCHGC050");
          } else if (x == "60 A") {
            id(inverter).queue_command("MUCHGC060");
          } else if (x == "70 A") {
            id(inverter).queue_command("MUCHGC070");
          } else if (x == "80 A") {
            id(inverter).queue_command("MUCHGC080");
          }

  # -------- Total battery charging current: PV + AC --------
  - platform: template
    id: total_charge_current_select
    name: "${friendly_name} Сумарний струм заряду [TOTAL_CHARGE_CURRENT]"
    entity_category: config
    optimistic: true
    restore_value: false
    options:
      - "10 A"
      - "20 A"
      - "30 A"
      - "40 A"
      - "50 A"
      - "60 A"
      - "70 A"
      - "80 A"
      - "90 A"
      - "100 A"
      - "110 A"
    set_action:
      - lambda: |-
          if (x == "10 A") {
            id(inverter).queue_command("MCHGC010");
          } else if (x == "20 A") {
            id(inverter).queue_command("MCHGC020");
          } else if (x == "30 A") {
            id(inverter).queue_command("MCHGC030");
          } else if (x == "40 A") {
            id(inverter).queue_command("MCHGC040");
          } else if (x == "50 A") {
            id(inverter).queue_command("MCHGC050");
          } else if (x == "60 A") {
            id(inverter).queue_command("MCHGC060");
          } else if (x == "70 A") {
            id(inverter).queue_command("MCHGC070");
          } else if (x == "80 A") {
            id(inverter).queue_command("MCHGC080");
          } else if (x == "90 A") {
            id(inverter).queue_command("MCHGC090");
          } else if (x == "100 A") {
            id(inverter).queue_command("MCHGC100");
          } else if (x == "110 A") {
            id(inverter).queue_command("MNCHGC0110");
          }

  # -------- Native pip2424mse1 selects --------
  - platform: pip2424mse1
    pipsolar_id: inverter

    output_source_priority:
      name: "${friendly_name} Пріоритет живлення [OUT_PRIORITY]"
      entity_category: config
      optionsmap:
        "Мережа першою": "POP00"
        "Сонце першою": "POP01"
        "SBU Сонце-АКБ-Мережа": "POP02"
      statusmap:
        "0": "Мережа першою"
        "1": "Сонце першою"
        "2": "SBU Сонце-АКБ-Мережа"

    charger_source_priority:
      name: "${friendly_name} Пріоритет заряджання [CHG_PRIORITY]"
      entity_category: config
      optionsmap:
        "Сонце першою": "PCP01"
        "Сонце і мережа": "PCP02"
        "Тільки сонце": "PCP03"
      statusmap:
        "1": "Сонце першою"
        "2": "Сонце і мережа"
        "3": "Тільки сонце"


# ============================================================
# OPTIONAL INVERTER SWITCHES
# Disabled by default where behaviour isn't needed day-to-day.
# ============================================================

switch:
  - platform: pip2424mse1
    pipsolar_id: inverter

    output_source_priority_utility:
      name: "${friendly_name} Режим Utility first [UTILITY_FIRST_SW]"
      entity_category: config
      disabled_by_default: true

    output_source_priority_solar:
      name: "${friendly_name} Режим Solar first [SOLAR_FIRST_SW]"
      entity_category: config
      disabled_by_default: true

    output_source_priority_battery:
      name: "${friendly_name} Режим SBU [SBU_SW]"
      entity_category: config
      disabled_by_default: true

    input_voltage_range:
      name: "${friendly_name} Вузький діапазон AC - UPS [AC_RANGE_SW]"
      entity_category: config
      disabled_by_default: true

    pv_ok_condition_for_parallel:
      name: "${friendly_name} PV OK condition [PV_OK_SW]"
      entity_category: config
      disabled_by_default: true

    pv_power_balance:
      name: "${friendly_name} PV Power Balance [PV_BALANCE_SW]"
      entity_category: config
      disabled_by_default: true

# ============================================================
# ESP32 MAINTENANCE
# ============================================================

button:
  - platform: restart
    name: "${friendly_name} Перезавантажити ESP32 [RESTART]"
    entity_category: diagnostic

  - platform: safe_mode
    name: "${friendly_name} Safe Mode [SAFE_MODE]"
    entity_category: diagnostic

  # ==========================================================
  # PROTOCOL DIAGNOSTICS: supported charge-current ranges
  # These are read-only queries. The raw inverter response is
  # visible in UART DEBUG.
  #
  # QMCHGCR  = supported TOTAL charging-current values
  # QMUCHGCR = supported AC/utility charging-current values
  # ==========================================================
  - platform: template
    name: "${friendly_name} Запит доступних TOTAL струмів [QMCHGCR]"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(inverter).queue_command("QMCHGCR");

  - platform: template
    name: "${friendly_name} Запит доступних AC струмів [QMUCHGCR]"
    entity_category: diagnostic
    on_press:
      - lambda: |-
          id(inverter).queue_command("QMUCHGCR");

